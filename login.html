<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grupo LA | Acceso BI</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/png" href="assets/LA_CLOTHES_Logotipo-04.png" />
</head>
<body>
  <div class="password-gate">
    <div class="password-card">
      <h1>Acceso restringido</h1>
      <p>Ingresa la contraseña para acceder al panel de BI.</p>

      <form action="/api/login" method="POST">
        <input
          id="password-input"
          type="password"
          name="password"
          placeholder="Contraseña"
          autocomplete="current-password"
          required
          autofocus
        />

        <button type="submit">Entrar</button>
      </form>

      <p id="login-error" class="password-error" aria-live="polite"></p>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);

    if (params.get('error') === '1') {
      document.getElementById('login-error').textContent =
        'Contraseña incorrecta';
    }
  </script>
</body>
</html>
