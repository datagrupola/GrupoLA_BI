<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grupo LA | BI Command Center</title>
  <link rel="stylesheet" href="styles.css?v=20260627-afluencia" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/LA_CLOTHES_Logotipo-04.png">
</head>
<body>
  <div class="app-shell" id="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand-logo">
          <img src="assets/LA_CLOTHES_Logotipo-04.png" alt="Logo LA" style="width: 40px; height: auto;">
        </div>
        <div class="brand-info">
          <strong>BI Center</strong>
        </div>
        <button class="toggle-btn" id="sidebar-toggle" aria-label="Alternar menú">☰</button>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-group">
          <small>MONITOREO DIRECTIVO</small>
          <button class="nav-btn active" data-view="global">
            <span class="dot dg"></span> <span>Global</span>
          </button>
          <button class="nav-btn" data-view="afluencia">
            <span class="dot af"></span> <span>Afluencia</span>
          </button>
          <button class="nav-btn" data-view="larousse_encuestas">
            <span class="dot en"></span> <span>Encuestas</span>
          </button>
        </div>

        <div class="nav-group">
          <small>DASHBOARDS POR MARCA</small>
          <button class="nav-btn" data-view="larousse">
            <span class="dot lr"></span> <span>La Rousse</span>
          </button>
          <button class="nav-btn" data-view="chino">
            <span class="dot cr"></span> <span>Chino Regalado</span>
          </button>
          <button class="nav-btn" data-view="pacas">
            <span class="dot pm"></span> <span>Pacas MX</span>
          </button>
        </div>
        
        <div class="nav-group">
          <a href="#documentacion" class="nav-link">
            <span class="nav-icon">📄</span> <span>Documentación</span>
          </a>
        </div>
      </nav>

      <div class="sidebar-footer">
        <div class="status-indicator">
          <span class="pulse-icon"></span>
          <span>Ecosistema Activo</span>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <div class="floating-actions">
        <a id="external-link" href="https://datastudio.google.com/reporting/f65fb799-b645-42a5-beb4-8a824fb86613" target="_blank" class="btn-minimal" title="Abrir en Looker Studio">↗</a>
      </div>

      <section class="dashboard-viewport">
        <div class="iframe-container">
          <iframe id="main-frame" src="https://datastudio.google.com/embed/reporting/f65fb799-b645-42a5-beb4-8a824fb86613/page/lZNyF" frameborder="0" allowfullscreen></iframe>
        </div>
      </section>
    </main>
  </div>

  <script src="scripts.js?v=20260627-afluencia"></script>
</body>
</html>
