<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grupo LA | BI Command Center</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-shell">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand-logo">LA</div>
        <div class="brand-info">
          <strong>BI Center</strong>
        </div>
        <button class="toggle-btn" onclick="toggleSidebar()" aria-label="Alternar menú">☰</button>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-group">
          <small>MONITOREO DIRECTIVO</small>
          <button class="nav-btn active" onclick="switchView('larousse')">
            <span class="dot lr"></span> <span>La Rousse</span>
          </button>
          <button class="nav-btn" onclick="switchView('chino')">
            <span class="dot cr"></span> <span>Chino Regalado</span>
          </button>
        </div>

        <div class="nav-group">
          <small>OPERACIÓN RÁPIDA</small>
          <a href="URL_APPSHEET_LA_ROUSSE" target="_blank" class="nav-link">
            <span class="nav-icon">📱</span> <span>AppSheet LR</span>
          </a>
          <a href="URL_APPSHEET_CHINO_REGALADO" target="_blank" class="nav-link">
            <span class="nav-icon">📱</span> <span>AppSheet CR</span>
          </a>
          <a href="#documentacion" class="nav-link">
            <span class="nav-icon">📄</span> <span>Documentación</span>
          </a>
        </div>
      </nav>

      <div class="sidebar-footer">
        <div class="status-indicator">
          <span class="pulse-icon"></span>
          <span>Ecosistema Activo</span>
        </div>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      <div class="floating-actions">
        <a id="external-link" href="https://datastudio.google.com/reporting/055e6005-5133-498d-8a93-4960dbc60f1b" target="_blank" class="btn-minimal" title="Abrir en Looker Studio">↗</a>
      </div>

      <section class="dashboard-viewport">
        <div class="iframe-container">
          <iframe id="main-frame" src="https://datastudio.google.com/embed/reporting/055e6005-5133-498d-8a93-4960dbc60f1b/page/aSIvF" frameborder="0" allowfullscreen></iframe>
        </div>
      </section>
    </main>
  </div>

  <script src="scripts.js"></script>
</body>
</html>
